name: Build macOS Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos-pkg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .pkg installer
        run: |
          mkdir -p output
          mkdir -p "build_payload/Library/Application Support/RMAddins/QuranInOffice"
          cp manifest.xml "build_payload/Library/Application Support/RMAddins/QuranInOffice/manifest.xml"

          mkdir -p scripts
          cat > scripts/postinstall << 'EOF'
          #!/bin/bash
          MANIFEST_SRC="/Library/Application Support/RMAddins/QuranInOffice/manifest.xml"
          CURRENT_USER=$(stat -f%Su /dev/console)
          USER_HOME=$(eval echo "~${CURRENT_USER}")
          # Word and PowerPoint have separate wef dirs on macOS (sandboxed containers)
          for APP_CONTAINER in com.microsoft.Word com.microsoft.Powerpoint; do
            WEF_DIR="${USER_HOME}/Library/Containers/${APP_CONTAINER}/Data/Documents/wef"
            mkdir -p "${WEF_DIR}"
            cp "${MANIFEST_SRC}" "${WEF_DIR}/manifest.xml"
            chown "${CURRENT_USER}:staff" "${WEF_DIR}/manifest.xml"
            chmod 644 "${WEF_DIR}/manifest.xml"
          done
          exit 0
          EOF
          chmod +x scripts/postinstall

          cat > scripts/preinstall << 'EOF'
          #!/bin/bash
          CURRENT_USER=$(stat -f%Su /dev/console)
          USER_HOME=$(eval echo "~${CURRENT_USER}")
          for APP_CONTAINER in com.microsoft.Word com.microsoft.Powerpoint; do
            WEF_DIR="${USER_HOME}/Library/Containers/${APP_CONTAINER}/Data/Documents/wef"
            rm -f "${WEF_DIR}/manifest.xml"
          done
          exit 0
          EOF
          chmod +x scripts/preinstall

          pkgbuild \
            --root build_payload \
            --scripts scripts \
            --identifier "com.rmdigital.quraninoffice.installer" \
            --version "2.0.0" \
            --install-location "/" \
            "output/QuranInOffice-Setup.pkg"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuranInOffice-macOS-pkg
          path: output/*.pkg
